function calcDays(a,b){if(!a||!b)return 0;return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000)+1)}

// ============================================================
// FERIE-ÅR & 6. FERIEUGE-ÅR HELPERS
// ------------------------------------------------------------
// Systemet kører med to ferieår sideløbende, så medarbejdere
// kan registrere ferie både i nuværende og kommende år.
//
//   - Ferieår: 1. september – 31. august
//     Et "ferieår-tal" angiver året hvor det STARTER. Fx 2025
//     dækker 1. sep 2025 – 31. aug 2026 og kaldes "2025/2026".
//   - 6. ferieuge-år: 1. januar – 31. december (kalenderår).
//
// Registreringer tilskrives automatisk det rigtige år ud fra
// from-datoen. Hver saldo har sit eget budget og kan ikke
// gå i minus uafhængigt af hinanden.
//
// VIGTIGT for fremtidige opdateringer: Når der laves nye
// felter eller funktioner der vedrører ferie eller 6. ferieuge,
// skal de respektere de to-årige saldi. calcStats returnerer:
//   vacUsedCur/vacLeftCur  – nuværende ferieår (sep–aug)
//   vacUsedNext/vacLeftNext – næste ferieår
//   w6UsedCur/w6LeftCur    – nuværende 6. ferieuge-år (jan–dec)
//   w6UsedNext/w6LeftNext  – næste 6. ferieuge-år
// (vacUsed/vacLeft/w6Used/w6Left bevares som aliaser for cur).
// ============================================================
function getVacYearOf(dateStr){
  // Returnerer start-året for det ferieår dateStr falder i.
  // Sep–dec → samme år. Jan–aug → år-1.
  if(!dateStr)return null;
  const parts=dateStr.split('-');
  const y=parseInt(parts[0]);
  const m=parseInt(parts[1]);
  return m>=9?y:y-1;
}
function getW6YearOf(dateStr){
  // 6. ferieuge bruger almindelig kalenderår.
  if(!dateStr)return null;
  return parseInt(dateStr.split('-')[0]);
}
function currentVacYear(){
  const now=new Date();
  return now.getMonth()>=8?now.getFullYear():now.getFullYear()-1;
}
function nextVacYear(){return currentVacYear()+1;}
function currentW6Year(){return new Date().getFullYear();}
function nextW6Year(){return currentW6Year()+1;}
function fmtVacYear(y){return y+'/'+(y+1);}
function fmtW6Year(y){return ''+y;}
function getEmpW6Budget(emp, year){
  // Returnerer budget for 6. ferieuge for et givet kalenderår.
  // Falder tilbage til emp.week6Hours hvis intet er sat for året.
  if(!emp)return 0;
  if(emp.week6HoursByYear&&emp.week6HoursByYear[year]!==undefined){
    return parseFloat(emp.week6HoursByYear[year])||0;
  }
  return parseFloat(emp.week6Hours)||0;
}

// ============================================================
const JUBILEE_YEARS = [10, 25, 30, 40, 50];
const ROUND_BIRTHDAYS = [30, 40, 50, 60, 70, 75, 80];

function getDayOfYear(date){
  const start = new Date(date.getFullYear(), 0, 0);
  return Math.floor((date - start) / 86400000);
}

function getNextBirthday(bdayStr){
  if(!bdayStr) return null;
  const now = new Date();
  const bday = new Date(bdayStr);
  let next = new Date(now.getFullYear(), bday.getMonth(), bday.getDate());
  if(next < now) next = new Date(now.getFullYear()+1, bday.getMonth(), bday.getDate());
  const age = next.getFullYear() - bday.getFullYear();
  const daysUntil = Math.round((next - now) / 86400000);
  const isRound = ROUND_BIRTHDAYS.includes(age);
  return {date: next, age, daysUntil, isRound, dateStr: next.toLocaleDateString('da-DK',{day:'2-digit',month:'long'})};
}

function getNextJubilee(startedStr){
  if(!startedStr) return null;
  const now = new Date();
  const started = new Date(startedStr);
  const yearsWorked = (now - started) / (365.25 * 86400000);
  for(const y of JUBILEE_YEARS){
    if(yearsWorked < y){
      const jubDate = new Date(started.getFullYear()+y, started.getMonth(), started.getDate());
      const daysUntil = Math.round((jubDate - now) / 86400000);
      return {years: y, date: jubDate, daysUntil, dateStr: jubDate.toLocaleDateString('da-DK',{day:'2-digit',month:'long',year:'numeric'})};
    }
  }
  return null;
}

function getYearsWorked(startedStr){
  if(!startedStr) return null;
  const now = new Date();
  const started = new Date(startedStr);
  return Math.floor((now - started) / (365.25 * 86400000));
}

function getUpcomingEvents(days=90){
  const events = [];
  const now = new Date();
  const cutoff = new Date(now.getTime() + days * 86400000);
  for(const emp of EMPLOYEES.filter(e=>!e.isAdmin)){
    if(emp.bday){
      const nb = getNextBirthday(emp.bday);
      if(nb && nb.date <= cutoff){
        events.push({type:'birthday', emp, ...nb});
      }
    }
    if(emp.started){
      const nj = getNextJubilee(emp.started);
      if(nj && nj.date <= cutoff){
        events.push({type:'jubilee', emp, ...nj});
      }
    }
  }
  return events.sort((a,b)=>a.date-b.date);
}

let FRITVALG_EMP=['rikke', 'bente', 'jeannette', 'merle', 'emma', 'grethe', 'anette', 'pernille', 'test'];
let OVERTIME_EMP=['rikke','bente','jeannette','merle','emma','grethe','anette','pernille','rie','ditte','ernisa','agnes','test'];

function getWeekStart(dateStr){
  const d=new Date(dateStr);
  const day=d.getDay();
  const diff=d.getDate()-(day===0?6:day-1);
  const mon=new Date(d.setDate(diff));
  return mon.toISOString().slice(0,10);}

function calcOvertimeBank(empId, reqs){
  const otReqs=reqs.filter(r=>r.userId===empId&&r.type==='overtime'&&r.status==='approved');
  const byWeek={};
  otReqs.forEach(r=>{
    const w=getWeekStart(r.from);
    byWeek[w]=(byWeek[w]||0)+(r.hours||0);});
  let bank=0;
  Object.values(byWeek).forEach(weekHours=>{
    const first=Math.min(weekHours,3);
    const rest=Math.max(0,weekHours-3);
    bank+=first*1.5+rest*2;});
  return Math.round(bank*10)/10;}

function calcOvertimeEarned(empId, reqs, newHours, newDate){
  const otReqs=reqs.filter(r=>r.userId===empId&&r.type==='overtime'&&r.status==='approved');
  const w=getWeekStart(newDate);
  const alreadyThisWeek=otReqs.filter(r=>getWeekStart(r.from)===w).reduce((s,r)=>s+(r.hours||0),0);
  const used3=Math.min(alreadyThisWeek,3);
  const rem3=Math.max(0,3-used3);
  const first=Math.min(newHours,rem3);
  const rest=Math.max(0,newHours-rem3);
  const earned=Math.round((first*1.5+rest*2)*10)/10;
  return{earned,first,rest,rem3,alreadyThisWeek};}
function getEmpByEmail(email){return EMPLOYEES.find(e=>e.email===email)}
function getEmpById(id){return EMPLOYEES.find(e=>e.id===id)}
function empIndex(id){return EMPLOYEES.findIndex(e=>e.id===id)}

function calcStats(empId, reqs){
  const empDef=EMPLOYEES.find(e=>e.id===empId);
  const empVacDays=empDef?.vacDays||VAC_DAYS;
  const r = reqs.filter(x=>x.userId===empId);

  // To-årig ferie (sep–aug)
  const curVac=currentVacYear();
  const nextVac=nextVacYear();
  const prevVac=curVac-1;
  const vacReqs=r.filter(x=>x.type==='vacation'&&x.status==='approved'&&!x.archived);
  const vacUsedCur=vacReqs.filter(x=>getVacYearOf(x.from)===curVac).reduce((s,x)=>s+x.days,0);
  const vacUsedNext=vacReqs.filter(x=>getVacYearOf(x.from)===nextVac).reduce((s,x)=>s+x.days,0);
  const vacUsedPrev=vacReqs.filter(x=>getVacYearOf(x.from)===prevVac).reduce((s,x)=>s+x.days,0);
  const vacLeftCur=empVacDays-vacUsedCur;
  const vacLeftNext=empVacDays-vacUsedNext;
  const vacLeftPrev=empVacDays-vacUsedPrev;
  const showPrevVac=vacLeftPrev>0;

  // To-årig 6. ferieuge (jan–dec)
  const curW6Year=currentW6Year();
  const nextW6YearV=nextW6Year();
  const w6Reqs=r.filter(x=>x.type==='week6'&&x.status==='approved'&&!x.archived);
  const w6UsedCurRaw=w6Reqs.filter(x=>getW6YearOf(x.from)===curW6Year).reduce((s,x)=>s+(x.hours||x.days*7.4||0),0);
  const w6UsedNextRaw=w6Reqs.filter(x=>getW6YearOf(x.from)===nextW6YearV).reduce((s,x)=>s+(x.hours||x.days*7.4||0),0);
  const w6BudgetCur=getEmpW6Budget(empDef,curW6Year);
  const w6BudgetNext=getEmpW6Budget(empDef,nextW6YearV);
  const w6UsedCur=Math.round(w6UsedCurRaw*100)/100;
  const w6UsedNext=Math.round(w6UsedNextRaw*100)/100;
  const w6LeftCur=Math.round((w6BudgetCur-w6UsedCurRaw)*100)/100;
  const w6LeftNext=Math.round((w6BudgetNext-w6UsedNextRaw)*100)/100;

  // Sygdom & resten (uændret)
  const sickDays= r.filter(x=>x.type==='sick'&&!x.archived).reduce((s,x)=>s+x.days,0);
  const ownSickDays= r.filter(x=>x.type==='sick'&&!x.archived&&x.sickType!=='barn').reduce((s,x)=>s+x.days,0);
  const otHours = r.filter(x=>x.type==='overtime'&&x.status!=='rejected'&&!x.archived).reduce((s,x)=>s+(x.hours||0),0);
  const flexHours= r.filter(x=>x.type==='flex'&&x.status==='approved'&&!x.archived).reduce((s,x)=>s+(x.hours||0),0);
  const hasSickBonus = !NO_SICK_BONUS_EMP.includes(empId);
  const bonus   = hasSickBonus ? Math.max(0, SICK_BONUS_MAX - ownSickDays*SICK_BONUS_PER_DAY) : null;
  const overtimeBank = OVERTIME_EMP.includes(empId)?calcOvertimeBank(empId,reqs):null;
  const flexBank = overtimeBank!==null?Math.round((overtimeBank-flexHours)*100)/100:null;

  return{
    // To-årige felter
    vacYearCur:curVac, vacYearNext:nextVac, vacYearPrev:prevVac, vacUsedPrev, vacLeftPrev, showPrevVac,
    vacUsedCur, vacLeftCur, vacUsedNext, vacLeftNext,
    w6YearCur:curW6Year, w6YearNext:nextW6YearV,
    w6UsedCur, w6LeftCur, w6BudgetCur,
    w6UsedNext, w6LeftNext, w6BudgetNext,
    // Aliaser for bagudkompatibilitet — peger på nuværende år
    vacUsed:vacUsedCur, vacLeft:vacLeftCur,
    w6Used:w6UsedCur, w6Left:w6LeftCur, w6Budget:w6BudgetCur,
    // Resten
    sickDays,ownSickDays,otHours,flexHours,bonus,hasSickBonus,overtimeBank,flexBank
  };
}

async function loadAllRequests(){
  const snap = await db.collection('requests').get();
  allRequests = snap.docs.map(d=>({id:d.id,...d.data()}));
}

async function sendMessage(fromId, fromName, toId, toName, text, replyToId=null){
  const msg = {fromId, fromName, toId, toName, text, replyToId, createdAt: new Date().toISOString(), readBy: [fromId]};
  await db.collection('messages').add(msg);
}

async function loadMessages(userId, isAdmin){
  const snap = await db.collection('messages').get();
  const all = snap.docs.map(d=>({id:d.id,...d.data()}));
  if(isAdmin) return all;
  return all.filter(m=>m.fromId===userId||m.toId===userId);
}

async function markMessageRead(msgId, userId){
  const ref = db.collection('messages').doc(msgId);
  const doc = await ref.get();
  if(doc.exists){
    const readBy = doc.data().readBy||[];
    if(!readBy.includes(userId)) await ref.update({readBy:[...readBy,userId]});
  }
}

async function saveAdminNote(empId, note){
  await db.collection('adminnotes').doc(empId).set({note, updatedAt: new Date().toISOString()});
}

async function loadAdminNote(empId){
  const doc = await db.collection('adminnotes').doc(empId).get();
  return doc.exists ? doc.data().note : '';
}

async function saveRequest(req){
  if(req.id){
    await db.collection('requests').doc(req.id).set(req);
  } else {
    const ref = await db.collection('requests').add(req);
    req.id = ref.id;
  }
}

async function updateRequestStatus(id, status){
  await db.collection('requests').doc(id).update({status});
}

}

const ADMIN_PIN_KEY='hr_admin_pin';
let _adminPinVerified=false;
let _adminInactivityTimer=null;
const ADMIN_TIMEOUT_MS=30*60*1000;
function resetAdminInactivityTimer(){if(!currentUser?.isAdmin)return;clearTimeout(_adminInactivityTimer);_adminInactivityTimer=setTimeout(()=>{_adminPinVerified=false;renderAdminPinPrompt();},ADMIN_TIMEOUT_MS);}
function startAdminActivityTracking(){['click','keydown','mousemove','touchstart'].forEach(ev=>{document.addEventListener(ev,resetAdminInactivityTimer,{passive:true});});resetAdminInactivityTimer();}
function stopAdminActivityTracking(){clearTimeout(_adminInactivityTimer);}
function renderAdminPinPrompt(err=''){
  const pin=localStorage.getItem(ADMIN_PIN_KEY);const isSetup=!pin;
  document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="login-card">
    <div class="logo">🔒 Administrator</div>
    <div class="logo-sub">${isSetup?'Opret din 4-cifrede PIN-kode':'Indtast din 4-cifrede PIN-kode'}</div>
    <div style="display:flex;gap:10px;justify-content:center;margin:24px 0">
      ${[0,1,2,3].map(i=>`<input id="pin-${i}" type="password" inputmode="numeric" maxlength="1" style="width:52px;height:60px;text-align:center;font-size:24px;font-weight:700;border:2px solid #e0e0da;border-radius:12px;outline:none" oninput="movePinFocus(${i})" onkeydown="pinKeyDown(event,${i})">`).join('')}
    </div>
    ${isSetup?`<div style="font-size:12px;color:#888;text-align:center;margin-bottom:16px">Du opsætter nu din PIN første gang</div>`:''}
    ${err?`<div style="color:#a32020;font-size:13px;text-align:center;margin-bottom:12px">${err}</div>`:''}
    <button class="btn btn-primary" style="width:100%;margin-bottom:12px" onclick="${isSetup?'setupAdminPin()':'checkAdminPin()'}">
      ${isSetup?'Opret PIN':'Bekræft'}
    </button>
    <button onclick="doLogout()" style="background:none;border:none;color:#aaa;font-size:12px;cursor:pointer;width:100%">Log ud</button>
  </div></div>`;
  setTimeout(()=>document.getElementById('pin-0')?.focus(),100);
}
function movePinFocus(i){
  if(document.getElementById('pin-'+i)?.value&&i<3)document.getElementById('pin-'+(i+1))?.focus();
  const all=[0,1,2,3].map(j=>document.getElementById('pin-'+j)?.value||'').join('');
  if(all.length===4){const p=localStorage.getItem(ADMIN_PIN_KEY);if(!p)setupAdminPin();else checkAdminPin();}
}
function pinKeyDown(e,i){
  if(e.key==='Backspace'&&!document.getElementById('pin-'+i)?.value&&i>0)document.getElementById('pin-'+(i-1))?.focus();
  if(e.key==='Enter'){const p=localStorage.getItem(ADMIN_PIN_KEY);if(!p)setupAdminPin();else checkAdminPin();}
}
function getPinInput(){return[0,1,2,3].map(i=>document.getElementById('pin-'+i)?.value||'').join('');}
function setupAdminPin(){
  const pin=getPinInput();
  if(pin.length!==4||!/^\d{4}$/.test(pin)){renderAdminPinPrompt('PIN skal være 4 cifre');return;}
  localStorage.setItem(ADMIN_PIN_KEY,pin);_adminPinVerified=true;startAdminActivityTracking();render();
}
function checkAdminPin(){
  const pin=getPinInput();const stored=localStorage.getItem(ADMIN_PIN_KEY);
  if(pin===stored){_adminPinVerified=true;startAdminActivityTracking();render();}
  else renderAdminPinPrompt('Forkert PIN-kode — prøv igen');
}
function resetAdminPin(){
  if(!confirm('Nulstil PIN-kode?'))return;
  localStorage.removeItem(ADMIN_PIN_KEY);_adminPinVerified=false;toast('PIN nulstillet ✓');doLogout();
}

auth.onAuthStateChanged(async user => {
  if(user){
    const emp = getEmpByEmail(user.email);
    if(!emp){
      await auth.signOut();
      renderLogin('Denne e-mail er ikke registreret i systemet.');
      return;
    }
    currentUser = emp;
    await loadAllRequests();
    await loadWeek6Hours();
    await loadEmpDates();
    await loadFritvalgList();
    await loadOvertimeList();
    await loadCustomEmployees();
    window._messages = await loadMessages(currentUser.id, currentUser.isAdmin);
    tab = emp.isAdmin ? 'admindash' : 'dashboard';
    if(emp.isAdmin&&!_adminPinVerified){renderAdminPinPrompt();}
    else{if(emp.isAdmin)startAdminActivityTracking();render();}
  } else {
    currentUser = null;
    _adminPinVerified = false;
    stopAdminActivityTracking();
    renderLogin();
  }
});

async function doLogin(){
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  errEl.textContent='';
  if(!email||!pass){errEl.textContent='Udfyld e-mail og kodeord.';return;}
  try{
    await auth.signInWithEmailAndPassword(email,pass);
  } catch(e){
    errEl.textContent = e.code==='auth/wrong-password'||e.code==='auth/user-not-found'||e.code==='auth/invalid-credential'
      ? 'Forkert e-mail eller kodeord.' : 'Fejl: '+e.message;
  }
}

async function doLogout(){
  await auth.signOut();
}

async function doChangePassword(){
  const p1=document.getElementById('cp-new').value;
  const p2=document.getElementById('cp-confirm').value;
  const errEl=document.getElementById('cp-err');
  errEl.textContent='';
  if(!p1||!p2){errEl.textContent='Udfyld begge felter.';return;}
  if(p1!==p2){errEl.textContent='Kodeordene matcher ikke.';return;}
  if(p1.length<6){errEl.textContent='Kodeord skal være mindst 6 tegn.';return;}
  try{
    await auth.currentUser.updatePassword(p1);
    toast('Kodeord opdateret ✓');
    tab='reg';render();
  } catch(e){
    if(e.code==='auth/requires-recent-login'){
      errEl.textContent='Log ud og ind igen for at skifte kodeord.';
    } else {errEl.textContent='Fejl: '+e.message;}
  }
}

function onTypeChange(){
  const t=document.getElementById('rtype')?.value;
  const hf=document.getElementById('hours-field');
  if(hf)hf.style.display=(t==='overtime'||t==='flex'||t==='week6'||t==='fritvalg')?'block':'none';
  const op=document.getElementById('overtime-preview');
  if(op)op.style.display='none';
  const eof=document.getElementById('emp-other-field');
  if(eof)eof.style.display=(t==='emp-other')?'block':'none';
  const tdf=document.getElementById('to-date-field');
  if(tdf)tdf.style.display=(t==='overtime')?'none':'block';
  if(t==='overtime'){const rto=document.getElementById('rto');if(rto)rto.value='';}
  const fdl=document.getElementById('from-date-label');
  if(fdl)fdl.textContent=(t==='overtime')?'Dato':'Fra dato';
  const hl=document.getElementById('hours-label');
  if(hl)hl.textContent=(t==='fritvalg')?'Timer (fritvalgskonto)':'Timer';}

function showOvertimePreview(){
  const type=document.getElementById('rtype')?.value;
  const hours=parseFloat(document.getElementById('rhours')?.value||0);
  const from=document.getElementById('rfrom')?.value||new Date().toISOString().slice(0,10);
  const op=document.getElementById('overtime-preview');
  if(!op)return;
  if(type!=='overtime'||!OVERTIME_EMP.includes(currentUser.id)||!hours){op.style.display='none';return;}
  const{earned,first,rest,alreadyThisWeek}=calcOvertimeEarned(currentUser.id,allRequests,hours,from);
  let txt='';
  if(first>0)txt+=first+'t × 1,5 = '+(Math.round(first*1.5*10)/10)+'t afspadsering (50%)';
  if(rest>0){if(txt)txt+=' + ';txt+=rest+'t × 2 = '+(rest*2)+'t afspadsering (100%)';}
  if(alreadyThisWeek>0)txt+=' ('+alreadyThisWeek+'t allerede registreret denne uge)';
  op.style.display='block';
  op.innerHTML='Optjener <strong>'+earned+' afspadserings-timer</strong> → '+txt;}

function autoFillToDate(){
  const from=document.getElementById('rfrom')?.value;
  const rto=document.getElementById('rto');
  const type=document.getElementById('rtype')?.value;
  if(from&&rto&&type!=='overtime'){
    // Always auto-fill to-date with from-date when user picks from-date
    rto.value=from;
  }
  updateDaysPreview();}

function updateDaysPreview(){
  const a=document.getElementById('rfrom')?.value,b=document.getElementById('rto')?.value;
  const dp=document.getElementById('days-preview');
  if(dp&&a&&b){const d=calcDays(a,b);dp.textContent=d+(d===1?' dag':' dage')+' valgt';}}

async function submitReq(){
  const type=document.getElementById('rtype')?.value;
  const from=document.getElementById('rfrom')?.value;
  const to=document.getElementById('rto')?.value;
  const note=document.getElementById('rnote')?.value||'';
  const hours=parseFloat(document.getElementById('rhours')?.value||0);
  if(!from){toast('Vælg venligst dato');return;}
  if(type!=='overtime'&&!to){toast('Vælg venligst slutdato');return;}
  if(type!=='overtime'&&new Date(to)<new Date(from)){toast('Slutdato skal være efter startdato');return;}
  const empOtherText=document.getElementById('remp-other-text')?.value||'';
  if(type==='emp-other'&&!empOtherText.trim()){toast('Beskriv venligst fraværet');return;}
  const effectiveTo = (type==='overtime'||type==='week6')?from:to;
  if(!effectiveTo&&type!=='week6'){toast('Vælg venligst slutdato');return;}
  const days=type==='week6'?1:calcDays(from,effectiveTo||from);
  if(type==='vacation'||type==='week6'){
    const stats=calcStats(currentUser.id,allRequests);
    let left, yearLabel;
    if(type==='vacation'){
      const yr=getVacYearOf(from);
      if(yr===stats.vacYearCur){left=stats.vacLeftCur;yearLabel=fmtVacYear(stats.vacYearCur);}
      else if(yr===stats.vacYearNext){left=stats.vacLeftNext;yearLabel=fmtVacYear(stats.vacYearNext);}
      else {left=0;yearLabel=fmtVacYear(yr);}
    } else {
      const yr=getW6YearOf(from);
      if(yr===stats.w6YearCur){left=stats.w6LeftCur;yearLabel=fmtW6Year(stats.w6YearCur);}
      else if(yr===stats.w6YearNext){left=stats.w6LeftNext;yearLabel=fmtW6Year(stats.w6YearNext);}
      else {left=0;yearLabel=fmtW6Year(yr);}
    }
    const label=type==='vacation'?'ferie':'6. ferieuge';
    const requested=type==='week6'?hours:days;
    if(requested>left){
      const over=Math.round((requested-left)*100)/100;
      const ok=confirm('Du har kun '+left+' '+(type==='week6'?'timer':'dag'+(left!==1?'e':''))+' tilbage af din '+label+' for '+yearLabel+'.\n\nDu søger '+requested+' '+(type==='week6'?'timer':'dage')+' – det er '+over+' '+(type==='week6'?'timer':'dag'+(over!==1?'e':''))+' mere end du har til rådighed.\n\nOverskydende vil stå som minus på din saldo.\n\nVil du alligevel sende anmodningen?');
      if(!ok)return;
    }
  }
  const req={userId:currentUser.id,userName:currentUser.name,type,from,to:effectiveTo,days,
    hours:(type==='overtime'||type==='flex'||type==='week6')?hours:null,note,
    ...(type==='emp-other'&&empOtherText?{customNote:empOtherText}:{}),
    status:'pending',
    createdAt:new Date().toISOString()};
  await saveRequest(req);
  allRequests.push(req);
  toast('Anmodning sendt ✓');
  setTimeout(()=>{tab='history';render()},700);}

async function renderEmpMessages(){
  const msgs = (window._messages||[]).filter(m=>m.fromId===currentUser.id||m.toId===currentUser.id)
    .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  
  // Mark unread as read
  for(const m of msgs){
    if(m.toId===currentUser.id&&!(m.readBy||[]).includes(currentUser.id)){
      await markMessageRead(m.id, currentUser.id);
    }
  }

  return`<div class="card">
    <div class="sec-title">Beskeder til administrator</div>
    <div style="max-height:400px;overflow-y:auto;margin-bottom:14px;padding-right:4px">
      ${msgs.length===0?'<div class="empty">Ingen beskeder endnu</div>':msgs.map(m=>{
        const isMe=m.fromId===currentUser.id;
        const time=new Date(m.createdAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
        return`<div style="display:flex;flex-direction:column;align-items:${isMe?'flex-end':'flex-start'};margin-bottom:10px">
          <div style="max-width:80%;background:${isMe?'#6c63d4':'#f0f0eb'};color:${isMe?'white':'#1a1a1a'};border-radius:${isMe?'14px 14px 4px 14px':'14px 14px 14px 4px'};padding:10px 14px;font-size:14px">
            ${m.text}
          </div>
          <div style="font-size:11px;color:#aaa;margin-top:3px">${isMe?'Dig':'Louise'} · ${time}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:8px">
      <textarea id="msg-text" placeholder="Skriv en besked til administrator..." style="flex:1;min-height:60px;resize:none"></textarea>
    </div>
    <button class="btn btn-primary" style="margin-top:8px;width:100%" onclick="sendEmpMessage()">Send besked</button>

async function sendEmpMessage(){
  const text=document.getElementById('msg-text')?.value?.trim();
  if(!text){toast('Skriv en besked først');return;}
  await sendMessage(currentUser.id,currentUser.name,'louise','Louise',text);
  window._messages = await loadMessages(currentUser.id, false);
  toast('Besked sendt ✓');
  setTimeout(()=>render(),300);}

async function empUpdateReq(id){
  const from=document.getElementById('edit-from-'+id)?.value;
  const to=document.getElementById('edit-to-'+id)?.value||from;
  const hoursEl=document.getElementById('edit-hours-'+id);
  const note=document.getElementById('edit-note-'+id)?.value||'';
  if(!from){toast('Vælg en dato');return;}
  const days=countDays(from,to);
  const updates={from,to,days,note,...(hoursEl?{hours:parseFloat(hoursEl.value)||0}:{})};
  await db.collection('requests').doc(id).update(updates);
  const idx=allRequests.findIndex(r=>r.id===id);
  if(idx>=0) allRequests[idx]={...allRequests[idx],...updates};
  window._editReqId=null;
  toast('Anmodning opdateret ✓');
  render();}

function autoFillMypToDate(){
  const from=document.getElementById('myp-from')?.value;
  const to=document.getElementById('myp-to');
  if(from&&to)to.value=from;}

function onMypTypeChange(){
  const t=document.getElementById('myp-type')?.value;
  const hw=document.getElementById('myp-hours-wrap');
  if(hw)hw.style.display=(t==='overtime'||t==='flex')?'block':'none';
  const tw=document.getElementById('myp-to-wrap');
  if(tw)tw.style.display=(t==='overtime')?'none':'block';
  const fl=document.getElementById('myp-from-label');
  if(fl)fl.textContent=(t==='overtime')?'Dato':'Fra dato';
  const of=document.getElementById('myp-other-field');
  if(of)of.style.display=(t==='emp-other')?'block':'none';}

async function submitMyProfile(){
  const type=document.getElementById('myp-type')?.value;
  const from=document.getElementById('myp-from')?.value;
  const to=document.getElementById('myp-to')?.value;
  const note=document.getElementById('myp-note')?.value||'';
  const hours=parseFloat(document.getElementById('myp-hours')?.value||0);
  const customNote=document.getElementById('myp-other-text')?.value||'';
  if(!from){toast('Vælg dato');return;}
  if(type!=='overtime'&&!to){toast('Vælg slutdato');return;}
  if(type==='emp-other'&&!customNote.trim()){toast('Beskriv fraværet');return;}
  const effectiveTo=type==='overtime'?from:to;
  const days=calcDays(from,effectiveTo);
  const isSick=type==='mysick';
  const req={
    userId:currentUser.id,userName:currentUser.name,
    type:isSick?'sick':type,
    from,to:effectiveTo,days,
    hours:(type==='overtime'||type==='flex'||type==='week6')?hours:null,
    note,
    ...(customNote?{customNote}:{}),
    status:'approved',
    createdAt:new Date().toISOString(),
    registeredByAdmin:true
  };
  await saveRequest(req);
  allRequests.push(req);
  toast('Registreret ✓');
  setTimeout(()=>render(),500);}

async function renderAdminMessages(){
  const msgs = (window._messages||[]).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  const empGroups = {};
  for(const m of msgs){
    const otherId = m.fromId==='louise'?m.toId:m.fromId;
    const otherName = m.fromId==='louise'?m.toName:m.fromName;
    if(!empGroups[otherId]) empGroups[otherId]={name:otherName,msgs:[]};
    empGroups[otherId].msgs.push(m);
  }
  // Add any employee not yet messaged to allow starting new conversation
  const allEmps = EMPLOYEES.filter(e=>!e.isAdmin&&e.canLogin);
  for(const emp of allEmps){
    if(!empGroups[emp.id]) empGroups[emp.id]={name:emp.name,msgs:[],noMessages:true};
  }

  // Mark all as read
  for(const m of msgs){
    if(m.toId==='louise'&&!(m.readBy||[]).includes('louise')){
      await markMessageRead(m.id,'louise');
    }
  }

  const empIds = Object.keys(empGroups).sort((a,b)=>{
    // Sort: unread first, then by latest message
    const aUnread=empGroups[a].msgs.filter(m=>m.toId==='louise'&&!(m.readBy||[]).includes('louise')).length;
    const bUnread=empGroups[b].msgs.filter(m=>m.toId==='louise'&&!(m.readBy||[]).includes('louise')).length;
    if(aUnread!==bUnread) return bUnread-aUnread;
    const aLatest=empGroups[a].msgs.length?new Date(empGroups[a].msgs[empGroups[a].msgs.length-1].createdAt):0;
    const bLatest=empGroups[b].msgs.length?new Date(empGroups[b].msgs[empGroups[b].msgs.length-1].createdAt):0;
    return bLatest-aLatest;
  });

  return`<div class="card" style="margin-bottom:14px">
    <div class="sec-title">Ny besked til medarbejder</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Vælg medarbejder</label>
        <select id="admin-msg-to">${EMPLOYEES.filter(e=>!e.isAdmin&&e.canLogin).map(e=>`<option value="${e.id}" data-name="${e.name}">${e.name}</option>`).join('')}</select>
      </div>
    </div>
    <div class="form-group">
      <textarea id="admin-msg-text" placeholder="Skriv besked til medarbejderen..." style="width:100%;min-height:70px;resize:none;font-size:13px"></textarea>
    </div>
    <button class="btn btn-primary" onclick="sendAdminNewMessage()">Send besked</button>
  </div>
  `+empIds.map(empId=>{
    const ci=empIndex(empId);
    const {bg,tc}=empColor(ci>=0?ci:0);
    const group=empGroups[empId];
    const unread=group.msgs.filter(m=>m.toId==='louise'&&!(m.readBy||[]).includes('louise')).length;
    return`<div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div class="av" style="background:${bg};color:${tc}">${EMPLOYEES.find(e=>e.id===empId)?.initials||'?'}</div>
        <div style="font-size:15px;font-weight:600">${group.name}</div>
        ${unread>0?`<span class="badge b-pending">${unread} ny${unread!==1?'e':''}</span>`:''}
      </div>
      <div style="max-height:300px;overflow-y:auto;margin-bottom:12px">
        ${group.msgs.map(m=>{
          const isMe=m.fromId==='louise';
          const time=new Date(m.createdAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
          return`<div style="display:flex;flex-direction:column;align-items:${isMe?'flex-end':'flex-start'};margin-bottom:8px">
            <div style="display:flex;align-items:flex-start;gap:6px">
              <div style="max-width:80%;background:${isMe?'#6c63d4':'#f0f0eb'};color:${isMe?'white':'#1a1a1a'};border-radius:${isMe?'14px 14px 4px 14px':'14px 14px 14px 4px'};padding:8px 12px;font-size:13px">${m.text}</div>
              <button onclick="deleteMessage('${m.id}')" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:2px 4px;flex-shrink:0;margin-top:2px" title="Slet besked">🗑</button>
            </div>
            <div style="font-size:11px;color:#aaa;margin-top:2px">${isMe?'Dig':m.fromName} · ${time}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:8px">
        <textarea id="admin-reply-${empId}" placeholder="Skriv svar..." style="flex:1;min-height:50px;resize:none;font-size:13px"></textarea>
        <button class="btn btn-primary" style="align-self:flex-end" onclick="sendAdminReply('${empId}','${group.name}')">Send</button>

  }).join('');}

async function deleteMessage(msgId){
  if(!confirm('Vil du slette denne besked?')) return;
  await db.collection('messages').doc(msgId).delete();
  window._messages = await loadMessages('louise', true);
  toast('Besked slettet ✓');
  setTimeout(()=>render(), 300);}

async function sendAdminNewMessage(){
  const sel=document.getElementById('admin-msg-to');
  const toId=sel?.value;
  const toName=sel?.options[sel.selectedIndex]?.dataset.name||sel?.options[sel.selectedIndex]?.text;
  const text=document.getElementById('admin-msg-text')?.value?.trim();
  if(!text){toast('Skriv en besked');return;}
  if(!toId){toast('Vælg en medarbejder');return;}
  await sendMessage('louise','Louise',toId,toName,text);
  window._messages = await loadMessages('louise',true);
  toast('Besked sendt ✓');
  setTimeout(()=>render(),300);}

async function sendAdminReply(toId, toName){
  const text=document.getElementById('admin-reply-'+toId)?.value?.trim();
  if(!text){toast('Skriv et svar først');return;}
  await sendMessage('louise','Louise',toId,toName,text);
  window._messages = await loadMessages('louise',true);
  toast('Svar sendt ✓');
  setTimeout(()=>render(),300);}

function renderBirthdays(){
  const now = new Date();
  const emps = EMPLOYEES.filter(e=>!e.isAdmin&&e.bday);
  const months = ['Januar','Februar','Marts','April','Maj','Juni','Juli','August','September','Oktober','November','December'];

  // Sort by birthday month/day
  const sorted = [...emps].sort((a,b)=>{
    const da = new Date(a.bday), db = new Date(b.bday);
    const am = da.getMonth()*100+da.getDate(), bm = db.getMonth()*100+db.getDate();
    return am - bm;
  });

  // Upcoming events next 90 days
  const upcoming = getUpcomingEvents(180);

  const monthGroups = {};
  for(const emp of sorted){
    const d = new Date(emp.bday);
    const m = d.getMonth();
    if(!monthGroups[m]) monthGroups[m] = [];
    monthGroups[m].push(emp);
  }

  const upcomingHtml = upcoming.length > 0 ? `
  <div class="card" style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border:none;color:white;margin-bottom:16px">
    <div style="font-size:15px;font-weight:600;margin-bottom:14px;color:white">🎉 Kommende begivenheder – næste 90 dage</div>
    ${upcoming.map(ev=>{
      const ci=empIndex(ev.emp.id);
      const {bg,tc}=empColor(ci>=0?ci:0);
      const label = ev.type==='birthday'
        ? (ev.isRound ? `🎂 Fylder ${ev.age} år` : `🎂 Fødselsdag (${ev.age} år)`)
        : `🏆 ${ev.years}-års jubilæum`;
      const days = ev.daysUntil===0?'I dag!':ev.daysUntil===1?'I morgen':`Om ${ev.daysUntil} dage`;
      return`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.2)">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="av" style="background:${bg};color:${tc}">${ev.emp.initials}</div>
          <div>
            <div style="font-size:14px;font-weight:600;color:white">${ev.emp.name}</div>
            <div style="font-size:12px;color:rgba(255,255,255,0.8)">${label} · ${ev.dateStr}</div>
          </div>
        </div>
        <div style="background:rgba(255,255,255,0.2);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:white;white-space:nowrap">${days}</div>
      </div>`;
    }).join('')}
  </div>` : '';

  const monthsHtml = Object.keys(monthGroups).sort((a,b)=>a-b).map(m=>{
    const empsInMonth = monthGroups[m];
    return`<div class="card" style="margin-bottom:12px">
      <div style="font-size:13px;font-weight:600;color:#6c63d4;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">${months[m]}</div>
      ${empsInMonth.map(emp=>{
        const ci=empIndex(emp.id);
        const {bg,tc}=empColor(ci>=0?ci:0);
        const bday = new Date(emp.bday);
        const age = now.getFullYear() - bday.getFullYear();
        const thisYearBday = new Date(now.getFullYear(), bday.getMonth(), bday.getDate());
        const nextAge = thisYearBday < now ? age+1 : age;
        const isRound = ROUND_BIRTHDAYS.includes(nextAge);
        const yearsWorked = emp.started ? getYearsWorked(emp.started) : null;
        const nextJub = emp.started ? getNextJubilee(emp.started) : null;
        return`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f0">
          <div style="display:flex;align-items:center;gap:12px">
            <div class="av" style="background:${bg};color:${tc}">${emp.initials}</div>
            <div>
              <div style="font-size:14px;font-weight:500;color:#1a1a1a">${emp.name}
                ${isRound?`<span style="background:#fef3e0;color:#9a5f0a;font-size:10px;padding:2px 8px;border-radius:20px;margin-left:6px;font-weight:600">Fylder ${nextAge}! 🎂</span>`:''}
              </div>
              <div style="font-size:12px;color:#aaa;margin-top:2px">${bday.getDate()}. ${months[bday.getMonth()].toLowerCase()} · ${nextAge} år i ${now.getFullYear()}</div>
              ${yearsWorked!==null?`<div style="font-size:11px;color:#aaa">${yearsWorked} år på klinikken${nextJub?` · Næste jubilæum: ${nextJub.years} år (${nextJub.dateStr})`:'  🌟 Jubilæum overskredet!'}</div>`:''}
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-size:22px;font-weight:700;color:#6c63d4">${bday.getDate()}/${bday.getMonth()+1}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  return upcomingHtml + `
  <div style="font-size:13px;color:#aaa;margin-bottom:14px">Jubilæum fejres ved 10, 25, 30, 40 og 50 års ansættelse</div>
  ${monthsHtml}`;
}

function checkAdminWeek6Budget(empId){
  const emp=EMPLOYEES.find(e=>e.id===empId);
  const stats=calcStats(empId,allRequests);
  const type=document.getElementById('admin-rtype')?.value;
  const hours=parseFloat(document.getElementById('admin-rhours')?.value||0);
  const from=document.getElementById('admin-rfrom')?.value;
  const preview=document.getElementById('admin-week6-preview');
  if(!preview)return;
  if(type==='week6'&&hours>0){
    let left, yearLabel;
    const yr=from?getW6YearOf(from):stats.w6YearCur;
    if(yr===stats.w6YearCur){left=stats.w6LeftCur;yearLabel=fmtW6Year(stats.w6YearCur);}
    else if(yr===stats.w6YearNext){left=stats.w6LeftNext;yearLabel=fmtW6Year(stats.w6YearNext);}
    else {left=0;yearLabel=fmtW6Year(yr);}
    if(left<hours){
      const over=Math.round((hours-left)*100)/100;
      preview.style.display='block';
      preview.innerHTML='⚠️ Medarbejderen har kun '+left+' timer tilbage for '+yearLabel+'. '+over+' timer vil gå i minus.';
    } else {
      preview.style.display='none';
    }
  } else {
    preview.style.display='none';
  }}

  // (settings/week6hours) og i den nye to-årige struktur.
  await saveWeek6HoursForYear(empId, currentW6Year(), hours);
}

async function saveWeek6HoursForYear(empId, year, hours){
  const emp=EMPLOYEES.find(e=>e.id===empId);
  if(!emp)return;
  const val=parseFloat(hours)||0;
  if(!emp.week6HoursByYear)emp.week6HoursByYear={};
  emp.week6HoursByYear[year]=val;
  // Hold også emp.week6Hours opdateret for nuværende år så bagudkompatibel
  // visning et andet sted i koden stadig viser noget fornuftigt.
  if(year===currentW6Year())emp.week6Hours=val;
  try{
    // Ny struktur: settings/week6hoursByYear → {empId: {year: timer, ...}, ...}
    await db.collection('settings').doc('week6hoursByYear').set(
      {[empId]: {[year]: val}},
      {merge: true}
    );
    // Bevar også den gamle struktur for nuværende år, så ældre versioner
    // af koden kan læse værdien.
    if(year===currentW6Year()){
      await db.collection('settings').doc('week6hours').set(
        {[empId]: val},
        {merge: true}
      );
    }
  }catch(e){console.error('saveWeek6HoursForYear error:',e);}
  toast('Gemt ✓');}

async function loadWeek6Hours(){
  // Læs både den gamle (year-løse) og den nye to-årige struktur.
  try{
    // Ny struktur: settings/week6hoursByYear → {empId: {year: timer, ...}}
    const docNew=await db.collection('settings').doc('week6hoursByYear').get();
    if(docNew.exists){
      const data=docNew.data();
      for(const emp of EMPLOYEES){
        if(data[emp.id]){
          emp.week6HoursByYear={...(emp.week6HoursByYear||{}),...data[emp.id]};
        }
      }
    }
    // Gammel struktur: settings/week6hours → {empId: timer} (gælder for nuværende år)
    const docOld=await db.collection('settings').doc('week6hours').get();
    if(docOld.exists){
      const data=docOld.data();
      const curY=currentW6Year();
      for(const emp of EMPLOYEES){
        if(data[emp.id]!==undefined){
          const v=parseFloat(data[emp.id])||0;
          emp.week6Hours=v;
          // Brug kun gamle værdi for nuværende år hvis nye struktur ikke har
          // sat den specifikt for dette år.
          if(!emp.week6HoursByYear)emp.week6HoursByYear={};
          if(emp.week6HoursByYear[curY]===undefined){
            emp.week6HoursByYear[curY]=v;
          }
        }
      }
    }
  }catch(e){console.error('loadWeek6Hours error:',e);}}

async function loadOvertimeList(){

    if(doc.exists&&doc.data().ids){
      // Use Firebase version (admin changes) but always include hardcoded defaults
      const firebaseIds=doc.data().ids;
      const defaultIds=['rikke','bente','jeannette','merle','emma','grethe','anette','pernille','rie','ditte','ernisa','agnes','test'];
      // Merge: keep firebase list but add any new defaults not yet in Firebase
      const merged=[...new Set([...firebaseIds,...defaultIds.filter(id=>!doc.data().hasOwnProperty('removed_'+id))])];
      OVERTIME_EMP.length=0;
      merged.forEach(id=>OVERTIME_EMP.push(id));

      await saveOvertimeList([...OVERTIME_EMP]);

}

async function loadCustomEmployees(){
  try{
    const doc=await db.collection('settings').doc('employees').get();
    if(doc.exists){
      const data=doc.data();
      for(const [id,emp] of Object.entries(data)){
        const existing=EMPLOYEES.find(e=>e.id===id);
        if(existing){
          // Update existing employee with saved data
          Object.assign(existing,emp);
        } else {
          // Add new employee created via admin
          EMPLOYEES.push(emp);
        }
      }
    }
  }catch(e){console.error('loadCustomEmployees error:',e);}
}

      <div class="form-group" style="margin:0"><label class="form-label">Fulde navn</label><input type="text" id="new-emp-name" placeholder="f.eks. Mette Hansen"></div>
      <div class="form-group" style="margin:0"><label class="form-label">E-mail</label><input type="email" id="new-emp-email" placeholder="mette@eksempel.dk"></div>
      <div class="form-group" style="margin:0"><label class="form-label">Fødselsdato</label><input type="date" id="new-emp-bday"></div>
      <div class="form-group" style="margin:0"><label class="form-label">Ansættelsesdato</label><input type="date" id="new-emp-started"></div>
      <div class="form-group" style="margin:0"><label class="form-label">Feriedage pr. år</label><input type="number" id="new-emp-vacdays" value="25" min="0" max="50"></div>
      <div class="form-group" style="margin:0"><label class="form-label">Kan logge ind</label>
        <select id="new-emp-canlogin"><option value="true">Ja</option><option value="false">Nej (admin-styret)</option></select>
      </div>
    </div>
    <div class="info-box info-box-warning" style="margin-bottom:10px">Husk også at oprette login i <strong>Firebase Console → Authentication → Add user</strong> med samme e-mail og kodeord 123456.</div>
    <button class="btn btn-primary" onclick="createEmployee()">Opret medarbejder</button>
  </div>
  <div class="card">
    <div class="sec-title">Medarbejdere</div>
    ${allEmps.map(emp=>{
      const ci=empIndex(emp.id);
      const {bg,tc}=empColor(ci>=0?ci:0);
      const isEditing=editId===emp.id;
      return`<div style="border-bottom:1px solid #f0f0eb;padding:10px 0">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:10px">
            <div class="av" style="background:${bg};color:${tc}">${emp.initials}</div>
            <div>
              <div style="font-size:14px;font-weight:500">${emp.name}${!emp.canLogin?'<span class="tag-no-login">Styres af admin</span>':''}</div>
              <div style="font-size:12px;color:#aaa">${emp.email||'Ingen e-mail'}</div>
            </div>
          </div>
          <button class="btn-sm" style="background:#e8f0fd;color:#1a4fa8;border:none;cursor:pointer" onclick="window._editEmpId=window._editEmpId==='${emp.id}'?null:'${emp.id}';render()">✏️ Rediger</button>
        </div>
        ${isEditing?`<div style="background:#f9f9f7;border-radius:10px;padding:12px;margin-top:10px;border:1px solid #e0e0da">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
            <div class="form-group" style="margin:0"><label class="form-label">Navn</label><input type="text" id="edit-emp-name-${emp.id}" value="${emp.name}"></div>
            <div class="form-group" style="margin:0"><label class="form-label">E-mail</label><input type="email" id="edit-emp-email-${emp.id}" value="${emp.email||''}"></div>
            <div class="form-group" style="margin:0"><label class="form-label">Fødselsdato</label><input type="date" id="edit-emp-bday-${emp.id}" value="${emp.bday||''}"></div>
            <div class="form-group" style="margin:0"><label class="form-label">Ansættelsesdato</label><input type="date" id="edit-emp-started-${emp.id}" value="${emp.started||''}"></div>
            <div class="form-group" style="margin:0"><label class="form-label">Feriedage pr. år</label><input type="number" id="edit-emp-vacdays-${emp.id}" value="${emp.vacDays||25}" min="0" max="50"></div>
            <div class="form-group" style="margin:0"><label class="form-label">Kan logge ind</label>
              <select id="edit-emp-canlogin-${emp.id}">
                <option value="true" ${emp.canLogin?'selected':''}>Ja</option>
                <option value="false" ${!emp.canLogin?'selected':''}>Nej</option>
              </select>
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" style="flex:1" onclick="saveEmployee('${emp.id}')">Gem ændringer</button>
            <button class="btn" style="background:#f0f0eb;flex:1" onclick="window._editEmpId=null;render()">Annuller</button>
          </div>
        </div>`:''}
      </div>`;}).join('')}
  </div>`;}

async function createEmployee(){
  const name=document.getElementById('new-emp-name')?.value?.trim();
  const email=document.getElementById('new-emp-email')?.value?.trim();
  const vacDays=parseInt(document.getElementById('new-emp-vacdays')?.value)||25;
  const canLogin=document.getElementById('new-emp-canlogin')?.value==='true';
  if(!name){toast('Skriv et navn');return;}
  // Generate ID from name
  const id=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'').slice(0,10)+'_'+Date.now().toString().slice(-4);
  const initials=name.split(' ').map(w=>w[0]?.toUpperCase()||'').join('').slice(0,2);
  const bday=document.getElementById('new-emp-bday')?.value||null;
  const started=document.getElementById('new-emp-started')?.value||null;
  const emp={id,name,email,initials,canLogin,isAdmin:false,vacDays,week6Hours:0,bday,started};
  EMPLOYEES.push(emp);
  // Save to Firebase
  await db.collection('settings').doc('employees').set({[id]:emp},{merge:true});
  toast(name+' oprettet ✓');
  window._editEmpId=null;
  ['new-emp-name','new-emp-email','new-emp-bday','new-emp-started'].forEach(i=>{const el=document.getElementById(i);if(el)el.value='';});
  render();}

async function saveEmployee(empId){
  const emp=EMPLOYEES.find(e=>e.id===empId);
  if(!emp)return;
  const name=document.getElementById('edit-emp-name-'+empId)?.value?.trim()||emp.name;
  const email=document.getElementById('edit-emp-email-'+empId)?.value?.trim()||emp.email;
  const vacDays=parseInt(document.getElementById('edit-emp-vacdays-'+empId)?.value)||emp.vacDays||25;
  const canLogin=document.getElementById('edit-emp-canlogin-'+empId)?.value==='true';
  const bday2=document.getElementById('edit-emp-bday-'+empId)?.value||emp.bday||null;
  const started2=document.getElementById('edit-emp-started-'+empId)?.value||emp.started||null;
  emp.name=name; emp.email=email; emp.vacDays=vacDays; emp.canLogin=canLogin; emp.bday=bday2; emp.started=started2;
  emp.initials=name.split(' ').map(w=>w[0]?.toUpperCase()||'').join('').slice(0,2);
  await db.collection('settings').doc('employees').set({[empId]:{...emp}},{merge:true});
  toast('Gemt ✓');
  window._editEmpId=null;
  render();}

// ============================================================
// ADMIN ACTIONS
// ============================================================
async function approveReq(id){
  await updateRequestStatus(id,'approved');
  allRequests.find(r=>r.id===id).status='approved';
  toast('Godkendt ✓');render();}

async function rejectReq(id){
  await updateRequestStatus(id,'rejected');
  allRequests.find(r=>r.id===id).status='rejected';
  toast('Afvist');render();}

async function deleteReq(id){
  if(!confirm('Er du sikker på at du vil slette denne registrering?'))return;
  await deleteRequest(id);
  allRequests=allRequests.filter(r=>r.id!==id);
  toast('Slettet');render();}

async function submitSick(){
  const empId=document.getElementById('sick-emp')?.value;
  const sickType=document.getElementById('sick-type')?.value;
  const from=document.getElementById('sick-from')?.value;
  const to=document.getElementById('sick-to')?.value;
  const note=document.getElementById('sick-note')?.value||'';

  if(!from||!to){toast('Vælg datoer');return;}
  if(new Date(to)<new Date(from)){toast('Slutdato skal være efter startdato');return;}
  const emp=getEmpById(empId);
  const days=calcDays(from,to);
  let type,sickSubType;
  if(sickType==='sick-own'){type='sick';sickSubType='own';}
  else{type='sick';sickSubType='barn';}
  const req={userId:empId,userName:emp.name,type,from,to,days,hours:null,note,
    ...(sickSubType&&{sickType:sickSubType}),
    status:'approved',createdAt:new Date().toISOString()};
  await saveRequest(req);
  allRequests.push(req);
  toast('Fravær registreret ✓');
  setTimeout(()=>render(),500);}

async function empDeleteReq(id){
  if(!confirm('Er du sikker på at du vil fortryde denne anmodning?'))return;
  await deleteRequest(id);
  allRequests=allRequests.filter(r=>r.id!==id);
  toast('Anmodning fortrudt');render();}

function openEmp(id){adminView='detail';adminEmpId=id;render()}
function goBack(){adminView='list';adminEmpId=null;render()}

// ============================================================
// SALDO-JUSTERINGER
// ============================================================
async function adjustW6Saldo(empId,budget,used){
  const val=parseFloat(document.getElementById('adj-w6-val')?.value);
  if(isNaN(val)){toast('Indtast en værdi');return;}
  const adj=Math.round((budget-val-used+used)*100)/100;
  const newUsed=Math.round((budget-val)*100)/100;
  const adjHours=Math.round((newUsed-used)*100)/100;
  await addSaldoAdjReq(empId,'week6',adjHours,`Saldo-justering: sat til ${val}t`);
  toast(`6. ferieuge-saldo sat til ${val}t ✓`);}

async function resetW6Saldo(empId,budget,used){
  if(!confirm('Nulstil 6. ferieuge-saldo til 0?'))return;
  const adj=Math.round((budget-used)*100)/100;
  await addSaldoAdjReq(empId,'week6',adj,'Nulstilling: saldo sat til 0');
  toast('6. ferieuge-saldo nulstillet ✓');}

async function adjustOTSaldo(empId,otBank,flexHours){
  const val=parseFloat(document.getElementById('adj-ot-val')?.value);
  if(isNaN(val)){toast('Indtast en værdi');return;}
  const newFlex=Math.round((otBank-val)*100)/100;
  const adjHours=Math.round((newFlex-flexHours)*100)/100;
  await addSaldoAdjReq(empId,'flex',adjHours,`Saldo-justering: sat til ${val}t`);
  toast(`Afspadserings-saldo sat til ${val}t ✓`);}

async function resetOTSaldo(empId,otBank,flexHours){
  if(!confirm('Nulstil afspadserings-saldo til 0?'))return;
  const adjHours=Math.round((otBank-flexHours)*100)/100;
  await addSaldoAdjReq(empId,'flex',adjHours,'Nulstilling: saldo sat til 0');
  toast('Afspadserings-saldo nulstillet ✓');}

async function addSaldoAdjReq(empId,type,hours,note){
  const emp=EMPLOYEES.find(e=>e.id===empId);
  const today=new Date().toISOString().slice(0,10);
  const req={userId:empId,userName:emp?.name||empId,type,hours,days:0,from:today,to:today,status:'approved',note,isAdjustment:true,createdAt:new Date().toISOString()};
  const ref=await db.collection('requests').add(req);
  allRequests.push({id:ref.id,...req});
  await loadAllRequests();
  render();}
</script>
